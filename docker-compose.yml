services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sugar_mommy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/sugar_mommy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/sugar_mommy
    depends_on:
      db:
        condition: service_healthy
    command: alembic -c db/alembic.ini upgrade head

volumes:
  pgdata:
